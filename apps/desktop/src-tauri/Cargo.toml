[package]
name = "kaydence"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Kaydence — local-first cross-platform AI dictation."
default-run = "kaydence"

[lib]
name = "kaydence_lib"
crate-type = ["lib", "cdylib", "staticlib"]

# Shipped binaries: `kaydence` (src/main.rs) and `kaydence-ctl` (the Wayland
# compositor-binding client, ADR-0023) are auto-discovered. Everything below is
# a developer/proof tool that must never reach an installer (see [features]).
[[bin]]
name = "asr-onnx-selftest"
path = "src/bin/asr-onnx-selftest.rs"
required-features = ["dev-tools"]

[[bin]]
name = "atspi-selftest"
path = "src/bin/atspi-selftest.rs"
required-features = ["dev-tools"]

[[bin]]
name = "reference-bench"
path = "src/bin/reference-bench.rs"
required-features = ["dev-tools"]

[[bin]]
name = "uia-selftest"
path = "src/bin/uia-selftest.rs"
required-features = ["dev-tools"]

[[bin]]
name = "vad-selftest"
path = "src/bin/vad-selftest.rs"
required-features = ["dev-tools"]

[[bin]]
name = "wayland-selftest"
path = "src/bin/wayland-selftest.rs"
required-features = ["dev-tools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ulid = { version = "1", features = ["serde"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
cpal = "0.17"
ringbuf = "0.5"
rubato = "1"
audioadapter-buffers = "2"

# Real ASR engine (P1-P0-2, ADR-0014). whisper.cpp bindings, MIT. OFF by default:
# the `asr-whisper` feature opts the native C++ compile in so the default build
# and CI stay fast and dependency-light until per-OS acceleration is matrix-proven.
# Loads a checksum-verified LOCAL ggml model — adds NO network surface (model
# download is a separate still-gated decision, ADR-0014 §4). audit-network stays green.
whisper-rs = { version = "0.16", optional = true }
# Model download-on-demand (P1-P0-2/P1-P0-8, ADR-0017). The ONE model-fetch
# network surface, OFF by default. ureq = minimal pure-Rust blocking client
# (rustls). Fetches only registry-pinned HTTPS sources; verify-before-install.
ureq = { version = "2", optional = true }
# Second local ASR lane (CTC, ADR-0016) + real Silero VAD — ONE shared ort
# (ONNX Runtime) dep. `default-features = false` is load-bearing: it drops ort's
# default `download-binaries` CDN fetch + ureq/tls chain, so NO network-at-build
# is even compiled. `load-dynamic` links the native libonnxruntime at RUNTIME
# from a pinned+checksummed asset (ORT_DYLIB_PATH), resolved through the same
# VerifiedArtifact seam as model weights — no build-time link, no CDN. OFF by
# default. (ort rc.12 pins ONNX Runtime 1.28.0; needs rustc >= 1.88.)
# `default-features = false` drops `download-binaries` (the build-time CDN fetch)
# but also the API-level + std that ort needs; `api-24` matches ONNX Runtime 1.28
# and `load-dynamic` pulls `std`. So: no build-time network, correct API surface.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["ndarray", "load-dynamic", "api-24"], optional = true }
# Match ort's ndarray (0.17) so our Array types satisfy ort's tensor traits
# (two ndarray majors in the graph would be distinct, incompatible types).
ndarray = { version = "0.17", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"

# Linux text injection (P1-P0-3, ADR-0013). AT-SPI = native insert + the
# secure-field signal (non-negotiable #8). atspi uses zbus/async-io; pollster
# drives it synchronously without pulling a tokio runtime into the inject path.
# NOT a network surface — audit-network stays green.
[target.'cfg(target_os = "linux")'.dependencies]
atspi = "0.30"
pollster = "0.4"
zbus = "5"
futures-lite = "2"
# uinput keystroke synthesis — the validated primary insertion path on Wayland
# (AT-SPI InsertText no-ops on modern GNOME; ADR-0013 amendment). Local device
# I/O, not a network surface.
evdev = "0.13"
# Wayland virtual-keyboard keystroke channel (ADR-0013 ladder rung 2, ADR-0023):
# `zwp_virtual_keyboard_v1` on Hyprland/wlroots — rootless, full Unicode via a
# per-injection XKB keymap. Pure-Rust wire protocol over the local Wayland
# socket; both crates were pre-approved in ADR-0013 (MIT, Smithay project).
# NOT a network surface.
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
# Safe syscall wrappers, already in the lockfile via the Wayland/zbus stacks
# (Apache-2.0/MIT): memfd for the keymap (never touches disk), SO_PEERCRED +
# getuid for the local control socket's same-user check. NOT a network surface.
rustix = { version = "1", features = ["fs", "net", "process"] }

# Windows text injection (P1-P0-3, ADR-0013). UI Automation = the secure-field
# signal (IsPassword, non-negotiable #8) AND the native insertion path
# (ValuePattern.SetValue — works on Windows, unlike AT-SPI on GNOME); SendInput
# KEYEVENTF_UNICODE is the keystroke fallback. Microsoft's official bindings,
# version already in-tree via tauri (0.61.x in Cargo.lock — no new version).
# Local OS input/COM APIs only — NOT a network surface; audit-network stays green.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    # Raw Input listener for the bare Right-Alt hotkey (ADR-0022).
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSData", "NSString"] }

[features]
# Developer/proof binaries (selftests, reference bench) are default-on so
# `cargo run --bin <name>` and CI's `--all-targets` keep building and linting
# them unchanged. They are declared below with `required-features =
# ["dev-tools"]` because the Tauri bundler only honours features passed to
# `tauri build`, never Cargo defaults — so these binaries stay OUT of every
# installer. Without this, tauri-cli 2.11 bundles one arbitrary src/bin binary
# (its get_binaries() treats `path.ends_with("")` as "already added").
default = ["dev-tools"]
dev-tools = []
custom-protocol = ["tauri/custom-protocol"]
# Feature-gated network surfaces stay OFF by default (non-negotiable #1).
byok = []
relay = []
# Real whisper.cpp ASR adapter (ADR-0014). OFF by default — opts the native
# whisper.cpp compile in. Not a network surface (loads a local verified model).
asr-whisper = ["dep:whisper-rs"]
# macOS-only acceleration proof lane. Keep separate from `asr-whisper` so
# Windows/Linux CPU builds never inherit Metal linkage through feature unification.
asr-whisper-metal = ["asr-whisper", "whisper-rs/metal"]
# Model download-on-demand (ADR-0017). OFF by default — opts the ureq client +
# the single models/download call site in. Default build stays zero-egress.
model-download = ["dep:ureq"]
# Real Silero VAD (ADR-0016) — an ONNX VadDetector behind the existing SpeechGate
# contract; EnergyVad stays the always-compiled fallback. OFF by default.
vad-silero = ["dep:ort", "dep:ndarray"]
# Second local ASR lane: CTC-decode ONNX adapter (ADR-0016), the ADR-0002 hedge
# alongside whisper.cpp. OFF by default. Shares the ort/ndarray deps with VAD.
asr-onnx = ["dep:ort", "dep:ndarray"]
